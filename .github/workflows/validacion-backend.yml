name: Validación backend Empleo

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/empleo-correcciones-auditoria

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar backend
        run: python -m compileall -q backend/app backend/auth.py backend/access.py
