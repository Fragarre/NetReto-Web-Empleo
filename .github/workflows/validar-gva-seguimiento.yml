name: Validar seguimiento recurrente GVA

on:
  push:
    branches: [feature/gva-seguimiento-recurrente]
    paths:
      - "backend/app/gva_estatal_seguimiento.py"
      - "backend/app/gva_estatal_service.py"
      - "backend/scripts/validar_gva_seguimiento.py"
      - ".github/workflows/validar-gva-seguimiento.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Compilar módulos
        run: python -m py_compile backend/app/gva_estatal_seguimiento.py backend/app/gva_estatal_service.py backend/scripts/validar_gva_seguimiento.py
      - name: Validar casos reales y planificación
        run: python backend/scripts/validar_gva_seguimiento.py
