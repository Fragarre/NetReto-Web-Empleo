name: Fix plazo local BOE
on:
  push:
    paths: ['.github/workflows/fix-plazo-local.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir plazo local enlazado al BOE
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/procesos.py')
          s=p.read_text(encoding='utf-8')
          old='''       p.lugar_examen, p.ultima_publicacion_at,\n       p.fuente_principal_id, p.datos_json,\n       COALESCE('''
          new='''       p.lugar_examen, p.ultima_publicacion_at,\n       p.fuente_principal_id, p.datos_json,\n       (SELECT MAX(pub_boe.fecha_publicacion) FROM publicaciones pub_boe JOIN fuentes f_boe ON f_boe.id=pub_boe.fuente_id WHERE pub_boe.proceso_id=p.id AND UPPER(COALESCE(f_boe.tipo,''))='BOE') AS fecha_boe_publicacion,\n       COALESCE('''
          if old not in s: raise SystemExit('SELECT_FIELDS no encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('backend/app/estado_proceso.py')
          s=p.read_text(encoding='utf-8')
          old='''    datos = proceso.get("datos_json") or {}\n    literal = str(datos.get("plazo_solicitudes_literal") or "").strip()\n    fecha_boe = proceso.get("fecha_convocatoria")\n    if literal and fecha_boe:\n'''
          new='''    datos = proceso.get("datos_json") or {}\n    boe_local = datos.get("boe_local") if isinstance(datos.get("boe_local"), dict) else {}\n    literal = str(\n        datos.get("plazo_solicitudes_literal")\n        or boe_local.get("plazo_solicitudes_literal")\n        or ""\n    ).strip()\n    fecha_boe = proceso.get("fecha_boe_publicacion") or proceso.get("fecha_convocatoria")\n    if literal and fecha_boe:\n'''
          if old not in s: raise SystemExit('bloque literal no encontrado')
          s=s.replace(old,new,1)
          old='''    origen = str(datos.get("origen") or "").upper()\n    boe_local = datos.get("boe_local")\n    if origen == "BOP_VALENCIA_MUNICIPAL" and not boe_local:\n'''
          new='''    origen = str(datos.get("origen") or "").upper()\n    if origen == "BOP_VALENCIA_MUNICIPAL" and not boe_local:\n'''
          if old not in s: raise SystemExit('bloque boe_local no encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/procesos.py backend/app/estado_proceso.py
          git commit -m "Usar BOE enlazado para mostrar plazos locales"
          git push