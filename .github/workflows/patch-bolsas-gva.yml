name: Patch bolsas GVA

on:
  push:
    paths:
      - '.github/workflows/patch-bolsas-gva.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar seguimiento de bolsas GVA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/gva_dogv_seguimiento.py')
          s = p.read_text(encoding='utf-8')

          old = "from .database import get_connection\nfrom .estado_proceso import clasificar_evento_terminal\n"
          new = "from .database import get_connection\nfrom .estado_proceso import clasificar_evento_terminal\nfrom .gva_bolsas_seguimiento import actualizar_bolsas_gva_simplificadas\n"
          if old not in s:
              raise SystemExit('No se encontró el bloque de imports')
          s = s.replace(old, new, 1)

          old = '''    plan = _planificar()\n    if not aplicar:\n        return {"modo": "SOLO_REVISION", "escrituras_bd": False, **plan}\n'''
          new = '''    plan = _planificar()\n    if not aplicar:\n        bolsas = actualizar_bolsas_gva_simplificadas(aplicar=False)\n        return {"modo": "SOLO_REVISION", "escrituras_bd": False, **plan, "bolsas": bolsas}\n'''
          if old not in s:
              raise SystemExit('No se encontró el retorno SOLO_REVISION')
          s = s.replace(old, new, 1)

          old = '''    return {\n        "modo": "APLICADO",\n        "escrituras_bd": True,\n        **plan,\n        "migraciones_aplicadas": migraciones_aplicadas,\n        "publicaciones_creadas": publicaciones_creadas,\n        "procesos_finalizados": procesos_finalizados,\n    }\n'''
          new = '''    bolsas = actualizar_bolsas_gva_simplificadas(aplicar=True)\n    return {\n        "modo": "APLICADO",\n        "escrituras_bd": True,\n        **plan,\n        "migraciones_aplicadas": migraciones_aplicadas,\n        "publicaciones_creadas": publicaciones_creadas,\n        "procesos_finalizados": procesos_finalizados,\n        "bolsas": bolsas,\n    }\n'''
          if old not in s:
              raise SystemExit('No se encontró el retorno APLICADO')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/gva_dogv_seguimiento.py
          git diff --cached --quiet && exit 0
          git commit -m "Completar seguimiento de bolsas GVA"
          git push
