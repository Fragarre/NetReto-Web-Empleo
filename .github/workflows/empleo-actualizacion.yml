name: Actualización NetReto Empleo

on:
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias mínimas
        run: pip install httpx

      - name: Ejecutar actualización
        env:
          EMPLOYMENT_CRON_SECRET: ${{ secrets.EMPLOYMENT_CRON_SECRET }}
          NETRETO_EMPLEO_API_URL: https://opocoach-web-staging-backend.onrender.com/empleo
        run: python backend/app/cron_actualizacion.py
