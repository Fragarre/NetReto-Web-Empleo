name: OPS aplicar GVA producción

on:
  push:
    branches:
      - ops/gva-produccion-validacion
    paths:
      - ".github/workflows/ops-gva-produccion-validacion.yml"

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar integración GVA estatal validada
        env:
          EMPLOYMENT_IMPORT_SECRET: ${{ secrets.EMPLOYMENT_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$EMPLOYMENT_IMPORT_SECRET"
          for fecha in 2026-03-04 2026-03-27 2026-04-20 2026-04-27 2026-05-08 2026-05-14 2026-07-08; do
            echo "=== $fecha ==="
            response=$(curl -fsS --max-time 90 -X POST \
              "https://netreto-empleo-api.onrender.com/admin/import/gva-estatal?desde=$fecha&hasta=$fecha&aplicar=true" \
              -H "X-Import-Secret: $EMPLOYMENT_IMPORT_SECRET")
            echo "$response" | python -m json.tool
            RESPONSE="$response" python - <<'PY'
import json, os
obj = json.loads(os.environ['RESPONSE'])
if obj.get('modo') != 'APLICADO':
    raise SystemExit(f"Modo inesperado: {obj.get('modo')}")
p = obj.get('persistencia') or {}
if p.get('modo') != 'APLICADO':
    raise SystemExit(f"Persistencia inesperada: {p}")
PY
          done
