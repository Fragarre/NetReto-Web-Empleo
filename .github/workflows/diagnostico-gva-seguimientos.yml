name: Diagnostico GVA seguimientos

on:
  push:
    branches: [feature/gva-seguimiento-recurrente]
    paths:
      - ".github/workflows/diagnostico-gva-seguimientos.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx beautifulsoup4
      - name: Inspeccionar A1-01
        run: |
          python - <<'PY'
          import httpx
          from bs4 import BeautifulSoup
          ref=221774
          url=f"https://administracion.gob.es/pagFront/ofertasempleopublico/detalleEmpleo.htm?idConvocatoria={ref}&idioma=es"
          r=httpx.get(url,timeout=60,follow_redirects=True,headers={"User-Agent":"NetReto-Empleo/1.0 (https://netexamenes.com)"})
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          for a in soup.find_all("a",href=True):
              href=str(a.get("href") or "")
              if "dogv.gva.es" not in href.lower():
                  continue
              dd=a.find_parent("dd")
              row=a.find_parent("div",class_=lambda c: c and "detalle-content-row" in c)
              print("\nHREF",href)
              print("DD", " ".join(dd.get_text(" ",strip=True).split())[:1800] if dd else None)
              print("ROW", " ".join(row.get_text(" ",strip=True).split())[:2200] if row else None)
          PY
