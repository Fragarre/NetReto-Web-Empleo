name: Diagnostico GVA seguimientos

on:
  push:
    branches: [feature/gva-seguimiento-recurrente]
    paths:
      - ".github/workflows/diagnostico-gva-seguimientos.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx beautifulsoup4
      - name: Inspeccionar contexto estructural DOGV
        run: |
          python - <<'PY'
          import httpx
          from bs4 import BeautifulSoup
          ref=219862
          url=f"https://administracion.gob.es/pagFront/ofertasempleopublico/detalleEmpleo.htm?idConvocatoria={ref}&idioma=es"
          r=httpx.get(url,timeout=60,follow_redirects=True,headers={"User-Agent":"NetReto-Empleo/1.0 (https://netexamenes.com)"})
          r.raise_for_status()
          soup=BeautifulSoup(r.text,"html.parser")
          for a in soup.find_all("a",href=True):
              href=str(a.get("href") or "")
              if "dogv.gva.es" not in href.lower():
                  continue
              print("\nHREF",href)
              node=a
              for nivel in range(1,6):
                  node=node.parent
                  if node is None: break
                  texto=" ".join(node.get_text(" ",strip=True).split())
                  print(f"L{nivel} <{node.name}> class={node.get('class')} id={node.get('id')} :: {texto[:1800]}")
          PY
