name: OPS diagnostico seguimiento GVA

on:
  push:
    branches:
      - ops/gva-produccion-validacion
    paths:
      - ".github/workflows/ops-gva-seguimiento-diagnostico.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar fechas de seguimientos conocidos en solo lectura
        env:
          EMPLOYMENT_IMPORT_SECRET: ${{ secrets.EMPLOYMENT_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$EMPLOYMENT_IMPORT_SECRET"
          for fecha in 2026-07-17 2026-09-09 2026-09-10 2026-09-11; do
            echo "=== $fecha ==="
            curl -fsS --max-time 120 -X POST \
              "https://netreto-empleo-api.onrender.com/admin/import/gva-estatal?desde=$fecha&hasta=$fecha&aplicar=false" \
              -H "X-Import-Secret: $EMPLOYMENT_IMPORT_SECRET" | python -m json.tool
          done
