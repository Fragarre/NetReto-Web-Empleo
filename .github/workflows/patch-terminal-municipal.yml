name: Patch terminal municipal

on:
  push:
    paths:
      - '.github/workflows/patch-terminal-municipal.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch municipal terminal rule
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/bop_valencia_municipios.py
          git diff --cached --quiet && exit 0
          git commit -m "Unificar criterio terminal municipal"
          git push
