name: OPS baseline seguimiento GVA

on:
  push:
    branches: [ops/gva-produccion-validacion]
    paths:
      - ".github/workflows/ops-gva-seguimiento-baseline.yml"

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Crear baseline silencioso y verificar no-op
        env:
          EMPLOYMENT_IMPORT_SECRET: ${{ secrets.EMPLOYMENT_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$EMPLOYMENT_IMPORT_SECRET"
          echo "=== PRIMERA PASADA: BASELINE ==="
          curl -fsS --max-time 300 -X POST \
            "https://netreto-empleo-api.onrender.com/admin/import/gva-estatal?desde=2026-09-11&hasta=2026-09-11&aplicar=true" \
            -H "X-Import-Secret: $EMPLOYMENT_IMPORT_SECRET" | python -m json.tool
          echo "=== SEGUNDA PASADA: SOLO REVISION ==="
          curl -fsS --max-time 300 -X POST \
            "https://netreto-empleo-api.onrender.com/admin/import/gva-estatal?desde=2026-09-11&hasta=2026-09-11&aplicar=false" \
            -H "X-Import-Secret: $EMPLOYMENT_IMPORT_SECRET" | python -m json.tool
