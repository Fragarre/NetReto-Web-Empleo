name: Diagnóstico conectividad GVA

on:
  workflow_dispatch:
  push:
    branches:
      - auditoria-gva-estatal
    paths:
      - ".github/workflows/diagnostico-gva.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar parser
        run: pip install beautifulsoup4

      - name: Inspeccionar tarjeta de resultado conocida
        run: |
          set -e
          url='https://administracion.gob.es/pagFront/ofertasempleopublico/resultadosEmpleo.htm?tipoBusqueda=CONVOCATORIAS&buscar=true&tipoFechas=intervaloFechas&fechaPublicacionDesde=08%2F07%2F2026&fechaPublicacionHasta=08%2F07%2F2026&orders=id&sort=desc&tam=100'
          curl -4 -L --fail --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' \
            -o /tmp/resultados.html "$url"
          python - <<'PY'
          from bs4 import BeautifulSoup
          import re
          html=open('/tmp/resultados.html',encoding='utf-8',errors='replace').read()
          soup=BeautifulSoup(html,'html.parser')
          a=soup.find('a',href=re.compile(r'(idRegistro|idConvocatoria)=221774'))
          print('ENLACE',a.get('href') if a else None)
          n=a
          for i in range(6):
              if not n: break
              n=n.parent
              if not n: break
              texto=' '.join(n.get_text(' ',strip=True).split())
              print('NIVEL',i+1,'TAG',n.name,'CLASS',n.get('class'),'ID',n.get('id'),'LEN',len(texto))
              print(texto[:1800])
          PY
