name: Validación fuente estatal GVA

on:
  workflow_dispatch:
  push:
    branches:
      - auditoria-gva-estatal
    paths:
      - ".github/workflows/diagnostico-gva.yml"
      - "backend/app/gva_estatal_source.py"
      - "backend/scripts/validar_gva_estatal_source.py"

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install httpx beautifulsoup4

      - name: Validar ocho oportunidades oficiales conocidas
        run: PYTHONPATH=. python scripts/validar_gva_estatal_source.py
