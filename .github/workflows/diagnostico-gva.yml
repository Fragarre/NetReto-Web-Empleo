name: Diagnóstico conectividad GVA

on:
  workflow_dispatch:
  push:
    branches:
      - auditoria-gva-estatal
    paths:
      - ".github/workflows/diagnostico-gva.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar parser
        run: pip install beautifulsoup4

      - name: Inspeccionar buscador avanzado oficial
        run: |
          set -e
          curl -4 -L --fail --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0' \
            -o /tmp/avanzado.html \
            'https://administracion.gob.es/pagFront/empleoBecas/empleo/buscadorEmpleoAvanzado.htm'
          python - <<'PY'
          from bs4 import BeautifulSoup
          html=open('/tmp/avanzado.html',encoding='utf-8',errors='replace').read()
          soup=BeautifulSoup(html,'html.parser')
          for sel in soup.find_all('select'):
              print('\nSELECT',sel.get('name'),sel.get('id'))
              for opt in sel.find_all('option'):
                  txt=' '.join(opt.get_text(' ',strip=True).split())
                  if txt:
                      print(' ',repr(opt.get('value')),txt[:160])
          for inp in soup.find_all('input'):
              if inp.get('name'):
                  print('INPUT',inp.get('name'),repr(inp.get('value')),inp.get('type'))
          PY
