name: Diagnóstico paginación GVA estatal

on:
  workflow_dispatch:
  push:
    branches:
      - auditoria-gva-estatal
    paths:
      - ".github/workflows/diagnostico-gva.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Validar páginas oficiales
        run: |
          set -e
          base='https://administracion.gob.es/pagFront/ofertasempleopublico/resultadosEmpleo.htm?tipoBusqueda=CONVOCATORIAS&buscar=true&tipoFechas=intervaloFechas&fechaPublicacionDesde=09%2F07%2F2026&fechaPublicacionHasta=09%2F07%2F2026&orders=id&sort=desc&tam=100'
          for p in 1 2 3; do
            url="$base&desde=$p"
            curl -4 -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' -o "/tmp/r$p.html" "$url"
            P="$p" python - <<'PY'
          import os,re
          h=open('/tmp/r'+os.environ['P']+'.html',encoding='utf-8',errors='replace').read()
          refs=[]
          for x in re.finditer(r'idConvocatoria=(\d+)',h):
              if x.group(1) not in refs: refs.append(x.group(1))
          m=re.search(r'name=["\']numPaginaActual["\'][^>]*value=["\'](\d+)',h,re.I)
          print('SOLICITADA',os.environ['P'],'ACTUAL',m.group(1) if m else '?','N',len(refs),'PRIMEROS',refs[:3],'ULTIMOS',refs[-3:])
          PY
          done
