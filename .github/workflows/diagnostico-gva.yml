name: Diagnóstico conectividad GVA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnostico-gva.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver DNS de fuentes oficiales
        run: |
          python - <<'PY'
          import socket
          for host in ('sede.gva.es','dogv.gva.es','hisenda.gva.es','administracion.gob.es'):
              print('\nHOST', host)
              try:
                  for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM):
                      print(item)
              except Exception as exc:
                  print(type(exc).__name__, exc)
          PY

      - name: Probar Sede GVA
        continue-on-error: true
        run: |
          curl -4 -v --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'NetReto-Empleo/0.1 (https://netexamenes.com)' \
            'https://sede.gva.es/detall-ocupacio-publica?id_emp=110206'

      - name: Probar DOGV
        continue-on-error: true
        run: |
          curl -4 -v --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'NetReto-Empleo/0.1 (https://netexamenes.com)' \
            'https://dogv.gva.es/datos/2026/05/14/pdf/2026_14981_es.pdf'

      - name: Probar portal de Hacienda GVA
        continue-on-error: true
        run: |
          curl -4 -v --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'NetReto-Empleo/0.1 (https://netexamenes.com)' \
            'https://hisenda.gva.es/es/web/recursos-humanos/oferta-ocupacio-publica-2026'

      - name: Probar Administracion.gob.es
        continue-on-error: true
        run: |
          curl -4 -v --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'NetReto-Empleo/0.1 (https://netexamenes.com)' \
            'https://administracion.gob.es/pagFront/ofertasempleopublico/detalleEmpleo.htm?idConvocatoria=220291'
