name: Diagnóstico conectividad GVA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnostico-gva.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Probar sumario diario DOGV
        run: |
          python - <<'PY'
          import urllib.request
          url='https://dogv.gva.es/datos/2026/09/11/PortalCAS.html'
          req=urllib.request.Request(url,headers={'User-Agent':'NetReto-Empleo/0.1 (https://netexamenes.com)'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=r.read().decode('utf-8','replace')
              print('STATUS',r.status)
              print('BYTES',len(data))
              print('TIENE_SECCION_EMPLEO', 'OFERTAS DE EMPLEO PÚBLICO' in data.upper())
              print(data[:1200])
          PY

      - name: Probar DOGV documento oficial
        run: |
          curl -4 --fail --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'NetReto-Empleo/0.1 (https://netexamenes.com)' \
            'https://dogv.gva.es/datos/2026/05/14/pdf/2026_14981_es.pdf'

      - name: Probar Administracion.gob.es
        run: |
          curl -4 --fail --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'NetReto-Empleo/0.1 (https://netexamenes.com)' \
            'https://administracion.gob.es/pagFront/ofertasempleopublico/detalleEmpleo.htm?idConvocatoria=220291'
