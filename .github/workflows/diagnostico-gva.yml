name: Diagnóstico conectividad GVA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnostico-gva.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Comparar sumarios DOGV
        run: |
          set +e
          for url in \
            'https://dogv.gva.es/datos/2026/09/11/PortalCAS.html' \
            'https://dogv.gva.es/datos/2024/07/03/PortalCAS.html'; do
            echo "URL=$url"
            curl -4 -L -sS --connect-timeout 10 --max-time 20 \
              -A 'Mozilla/5.0' \
              -D /tmp/headers.txt -o /tmp/body.html "$url"
            rc=$?
            echo "RC=$rc"
            head -20 /tmp/headers.txt
            echo "BYTES=$(wc -c </tmp/body.html 2>/dev/null || echo 0)"
            grep -oi 'OFERTAS DE EMPLEO PÚBLICO' /tmp/body.html | head || true
          done
          exit 0

      - name: Inspeccionar formulario oficial de empleo estatal
        run: |
          curl -4 -L --fail --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0' \
            -o /tmp/buscador.html \
            'https://administracion.gob.es/pagFront/empleoBecas/empleo/buscadorEmpleo.htm'
          echo "BYTES=$(wc -c </tmp/buscador.html)"
          python - <<'PY'
          from html.parser import HTMLParser

          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='form':
                      print('FORM', d.get('action'), d.get('method'))
                  elif tag in {'input','select','option'}:
                      name=d.get('name')
                      if name or tag=='option':
                          print(tag.upper(), 'name=',name,'value=',d.get('value'),'id=',d.get('id'))
          html=open('/tmp/buscador.html',encoding='utf-8',errors='replace').read()
          P().feed(html)
          PY

      - name: Probar detalle oficial estatal
        run: |
          curl -4 -L --fail --connect-timeout 10 --max-time 20 -o /dev/null \
            -A 'Mozilla/5.0' \
            'https://administracion.gob.es/pagFront/ofertasempleopublico/detalleEmpleo.htm?idConvocatoria=220291&idioma=es'
